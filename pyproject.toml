[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sidjily"
version = "0.1.0"
description = "Application de bureau locale pour organiser des recherches Sidjilcom"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Projet SIDJILY" }]
dependencies = ["playwright>=1.48,<2"]

[project.scripts]
sidjily = "sidjily.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
